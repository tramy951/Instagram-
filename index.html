    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 1. CAROUSEL LOGIC 
            const carousels = document.querySelectorAll('.carousel-container');
            carousels.forEach(container => {
                const track = container.querySelector('.carousel-track');
                const prevBtn = container.querySelector('.carousel-prev');
                const nextBtn = container.querySelector('.carousel-next');
                const dots = container.querySelectorAll('.dot');

                if (!track || !prevBtn || !nextBtn) return;

                const slideCount = track.children.length;
                let currentIndex = 0;

                const updateCarousel = () => {
                    track.style.transform = `translateX(-${currentIndex * 100}%)`;

                    prevBtn.className = `carousel-prev absolute left-3 top-1/2 -translate-y-1/2 bg-black/60 text-white p-1.5 rounded-full ${currentIndex === 0 ? 'fade-out' : 'fade-in'}`;
                    nextBtn.className = `carousel-next absolute right-3 top-1/2 -translate-y-1/2 bg-black/60 text-white p-1.5 rounded-full ${currentIndex === slideCount - 1 ? 'fade-out' : 'fade-in'}`;

                    dots.forEach((dot, idx) => {
                        if (idx === currentIndex) {
                            dot.classList.replace('bg-gray-500', 'bg-[#0095F6]');
                        } else {
                            dot.classList.replace('bg-[#0095F6]', 'bg-gray-500');
                        }
                    });
                };

                nextBtn.addEventListener('click', () => {
                    if (currentIndex < slideCount - 1) {
                        currentIndex++;
                        updateCarousel();
                    }
                });

                prevBtn.addEventListener('click', () => {
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateCarousel();
                    }
                });
            });

            // 2. LIKE LOGIC (Thả tim đổi đỏ)
            const likeBtns = document.querySelectorAll('.like-btn');
            likeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const icon = this.querySelector('.heart-icon');
                    // Icon Tim Đỏ (Filled)
                    const filledPath = `<path d="M3.465 14.502C1.468 12.553 0 10.198 0 7.222 0 3.904 2.652 1.05 5.753 1.05c2.378 0 4.195 1.155 5.586 2.923C12.73 2.205 14.547 1.05 16.925 1.05 20.026 1.05 22.678 3.904 22.678 7.222c0 2.976-1.468 5.331-3.465 7.28L11.339 22.186l-7.874-7.684Z"></path>`;
                    // Icon Tim Trắng (Outline)
                    const outlinePath = `<path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.67 2.161 4.21 4.21 0 0 1 3.67-2.161M12 2.19c-1.921 0-3.67 1.05-4.5 2.766a5.193 5.193 0 0 0-4.5-2.766 6.983 6.983 0 0 0-7 7.234c0 4.261 3.42 6.84 6.758 9.8 2.453 2.176 3.865 3.431 4.542 3.868a.754.754 0 0 0 .8 0c.677-.437 2.089-1.692 4.542-3.868 3.338-2.96 6.758-5.539 6.758-9.8a6.983 6.983 0 0 0-7-7.234Z" fill="none" stroke="currentColor" stroke-width="2"></path>`;

                    const isLiked = this.classList.contains('text-red-500');
                    const post = this.closest('article');
                    const likeCountEl = post.querySelector('.like-count');
                    let count = parseInt(likeCountEl.innerText.replace(/[^0-9]/g, ''));

                    if (isLiked) {
                        this.classList.remove('text-red-500');
                        this.classList.add('text-white');
                        icon.innerHTML = outlinePath;
                        icon.setAttribute('fill', 'none');
                        count--;
                    } else {
                        this.classList.remove('text-white');
                        this.classList.add('text-red-500');
                        icon.innerHTML = filledPath;
                        icon.setAttribute('fill', 'currentColor');
                        count++;

                        icon.classList.remove('animate-pop');
                        void icon.offsetWidth; 
                        icon.classList.add('animate-pop');
                    }
                    likeCountEl.innerText = count.toLocaleString('vi-VN') + " lượt thích";
                });
            });

            // 3. COMMENT LOGIC (Nhập bình luận)
            const commentForms = document.querySelectorAll('.comment-form');
            commentForms.forEach(form => {
                const input = form.querySelector('.comment-input');
                const submitBtn = form.querySelector('.submit-btn');

                input.addEventListener('input', () => {
                    if (input.value.trim().length > 0) {
                        submitBtn.classList.replace('opacity-50', 'opacity-100');
                        submitBtn.classList.remove('cursor-not-allowed');
                        submitBtn.disabled = false;
                    } else {
                        submitBtn.classList.replace('opacity-100', 'opacity-50');
                        submitBtn.classList.add('cursor-not-allowed');
                        submitBtn.disabled = true;
                    }
                });

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const text = input.value.trim();
                    if (!text) return;

                    const post = form.closest('article');
                    const commentsList = post.querySelector('.comments-list');

                    const newComment = document.createElement('div');
                    newComment.innerHTML = `<span class="font-semibold mr-1">you</span><span>${text}</span>`;
                    commentsList.appendChild(newComment);

                    input.value = '';
                    submitBtn.classList.replace('opacity-100', 'opacity-50');
                    submitBtn.classList.add('cursor-not-allowed');
                    submitBtn.disabled = true;
                });
            });
        });
    </script>
</body>
</html>
