<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lil Miquela - Instagram Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ẩn thanh cuộn để giống app mobile nhất */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Hiệu ứng Pop khi thả tim */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }

        /* Ẩn hiện mượt mà nút mũi tên carousel */
        .fade-in { opacity: 1; pointer-events: auto; transition: opacity 0.2s; }
        .fade-out { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    </style>
</head>
